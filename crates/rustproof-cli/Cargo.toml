[package]
name = "rustproof-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "rustproof"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
rustproof-core = { path = "../rustproof-core" }
rustproof-pipeline = { path = "../rustproof-pipeline" }
rustproof-prover = { path = "../rustproof-prover" }

[dev-dependencies]
assert_cmd = "2.2"
